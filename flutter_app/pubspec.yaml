name: baytak_ar
description: Whole-kitchen & furniture AR visualizer - Amman demo catalogue.
publish_to: 'none'
version: 0.7.0+4

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  model_viewer_plus: ^1.10.0
  camera: ^0.11.0
  path_provider: ^2.1.3
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  shared_preferences: ^2.3.0
  http: ^1.2.0
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/blueprints/
    - assets/thumbs/
    - assets/textures/
